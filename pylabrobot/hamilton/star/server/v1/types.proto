syntax = "proto3";

// What the STAR server's services share: the wire's conventions, the device's own enums, and
// the small messages lists, optional values and ranges travel as.
//
// Every request has one field per argument of the Python method it calls, named as the argument
// is. The conventions a client keeps to:
// - An unset field with presence is an argument not given: the method's default applies. An
//   argument that may be None defaults to None, so "None" and "not given" are the same.
// - A list that may be absent is a `...List` message holding `values`; a list or map entry that
//   may be absent is an `Optional...` message holding `value`.
// - An argument of several types is a oneof, its members in the order the method names them.
// - A named value is the enum value of the enum's prefix and the name upper-cased, each run of
//   anything but letters and digits one `_`: "A1 or B2" is `LLD_SENSOR_A1_OR_B2`.
// - A resource is a `ResourceRef` by id, on the resource server the STAR server uses.
// Units are PLR's: mm, uL, seconds, degrees.
package pylabrobot.hamilton.star.server.v1;

import "pylabrobot/resources/server/v1/types.proto";

