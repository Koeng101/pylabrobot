// ============================================================================================
// Records
// ============================================================================================

// One joint's position.
message ISwapJoint {
  ISwapAxis key = 1;
  double value = 2;
}

// A Hamilton liquid class: how a liquid is drawn and expelled.
message LiquidClass {
  repeated LiquidClassCurveEntry curve = 1;
  double aspiration_flow_rate = 2;
  double aspiration_mix_flow_rate = 3;
  double aspiration_air_transport_volume = 4;
  double aspiration_blow_out_volume = 5;
  double aspiration_swap_speed = 6;
  double aspiration_settling_time = 7;
  double aspiration_over_aspirate_volume = 8;
  double aspiration_clot_retract_height = 9;
  double dispense_flow_rate = 10;
  double dispense_mode = 11;
  double dispense_mix_flow_rate = 12;
  double dispense_air_transport_volume = 13;
  double dispense_blow_out_volume = 14;
  double dispense_swap_speed = 15;
  double dispense_settling_time = 16;
  double dispense_stop_flow_rate = 17;
  double dispense_stop_back_volume = 18;
}

// A point of a liquid class's correction curve: a volume and the volume drawn for it.
message LiquidClassCurveEntry {
  double key = 1;
  double value = 2;
}

// Mixing during a transfer: cycles of drawing and expelling.
message Mix {
  double volume = 1;
  int32 repetitions = 2;
  double flow_rate = 3;
  double surface_following_distance = 4;
  bool auto_surface_following = 5;
}

// Where a channel's reference point is to be, along each axis given.
message ReferencePointYZ {
  optional double y = 1;
  optional double z = 2;
}

// Where a tip goes: a spot or a trash, or a location on the deck.
message TipDestination {
  oneof tip_destination {
    pylabrobot.resources.server.v1.ResourceRef resource = 1;
    pylabrobot.resources.server.v1.Vec3 location = 2;
  }
}

// One arm's working envelope: how far it wraps, and the X it can work in.
message WorkingEnvelope {
  double wrap_size = 1;
  DoubleRange workspace = 2;
}

// ============================================================================================
// What the device answers
// ============================================================================================

// What the device answered a command: the reply as it came, or parsed by the format the
// command gave.
message FirmwareReply {
  oneof reply {
    string raw = 1;
    ParsedReply parsed = 2;
  }
}

// A reply parsed by its format: each parameter by its two-letter name.
message ParsedReply {
  map<string, FirmwareValue> parameters = 1;
}

// One parsed parameter: a number, text, or a list of either.
message FirmwareValue {
  oneof value {
    int64 integer = 1;
    string text = 2;
    Int64List integers = 3;
    StringList texts = 4;
  }
}

// ============================================================================================
// Values: lists, optional values, ranges, dates
// ============================================================================================

message Barcode2DSymbologyList {
  repeated Barcode2DSymbology values = 1;
}

message BarcodeSymbologyList {
  repeated BarcodeSymbology values = 1;
}

message BoolList {
  repeated bool values = 1;
}

// A calendar date.
message Date {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
}

message DoubleList {
  repeated double values = 1;
}

// A closed range.
message DoubleRange {
  double min = 1;
  double max = 2;
}

message Int32List {
  repeated int32 values = 1;
}

// A closed range.
message Int32Range {
  int32 min = 1;
  int32 max = 2;
}

message Int64List {
  repeated int64 values = 1;
}

message LLDModeList {
  repeated LLDMode values = 1;
}

message LiquidClassList {
  repeated LiquidClass values = 1;
}

message OptionalDouble {
  optional double value = 1;
}

message OptionalDoubleList {
  repeated OptionalDouble values = 1;
}

message OptionalMix {
  Mix value = 1;
}

message OptionalMixList {
  repeated OptionalMix values = 1;
}

message OptionalResourceNode {
  pylabrobot.resources.server.v1.ResourceNode value = 1;
}

message OptionalString {
  optional string value = 1;
}

message OptionalVec3 {
  pylabrobot.resources.server.v1.Vec3 value = 1;
}

message ResourceRefList {
  repeated pylabrobot.resources.server.v1.ResourceRef values = 1;
}

// A table that may be absent.
message StringInt32Map {
  map<string, int32> entries = 1;
}

message StringList {
  repeated string values = 1;
}

message Vec3List {
  repeated pylabrobot.resources.server.v1.Vec3 values = 1;
}
