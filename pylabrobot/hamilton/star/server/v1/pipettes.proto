syntax = "proto3";

// The independent pipetting channels.
package pylabrobot.hamilton.star.server.v1;

import "pylabrobot/hamilton/star/server/v1/types.proto";
import "pylabrobot/resources/server/v1/types.proto";

// What every channel shares, and one entry per channel.
message PipettesConfiguration {
  int32 hardware_query_first_year = 1;
  DoubleRange initialize_y_range = 2;
  double initialize_begin_of_tip_deposit = 3;
  double initialize_end_of_tip_deposit = 4;
  double initialize_z_position_at_end = 5;
  int32 initialize_tip_type = 6;
  int32 initialize_discarding_method = 7;
  int32 initialize_read_timeout = 8;
  string x_reference_anchor = 9;
  string y_reference_anchor = 10;
  string z_reference_anchor = 11;
  double y_drive_mm_per_increment = 12;
  double z_drive_mm_per_increment = 13;
  Int32Range z_range_increments = 14;
  Int32Range y_range_increments = 15;
  Int32Range y_drive_speed_range_increments = 16;
  Int32Range y_drive_acceleration_level_range = 17;
  Int32Range y_drive_current_limit_range = 18;
  Int32Range clld_detection_edge_range = 19;
  Int32Range clld_detection_drop_range = 20;
  Int32Range lld_post_detection_distance_range_increments = 21;
  Int32Range lld_max_delta_range_increments = 22;
  Int32Range plld_detection_edge_range = 23;
  Int32Range plld_detection_drop_range = 24;
  Int32Range plld_foam_detection_drop_range = 25;
  Int32Range plld_foam_detection_edge_tolerance_range = 26;
  Int32Range plld_foam_ad_values_range = 27;
  Int32Range plld_foam_search_speed_range_increments = 28;
  Int32Range z_drive_speed_range_increments = 29;
  Int32Range z_drive_acceleration_range_increments = 30;
  Int32Range z_drive_current_limit_range = 31;
  Int32Range z_touch_pwm_range = 32;
  map<string, int32> drive_parameters = 33;
  DoubleRange z_range = 34;
  double dispensing_drive_mm_per_increment = 35;
  double dispensing_drive_uL_per_increment = 36;
  Int32Range dispensing_drive_speed_range_increments = 37;
  Int32Range dispensing_drive_acceleration_range_increments = 38;
  Int32Range dispensing_drive_current_limit_range = 39;
  Int32Range dispensing_drive_volume_range_increments = 40;
  Int32Range dispensing_drive_position_range_increments = 41;
  Int32Range dispensing_drive_move_acceleration_range_increments = 42;
  Int32Range blow_out_air_draw_range_increments = 43;
  Int32Range mechanical_clearance_steps_range = 44;
  Int32Range pipetting_volume_range_increments = 45;
  Int32Range pipetting_speed_range_increments = 46;
  Int32Range pipetting_distance_range_increments = 47;
  Int32Range swap_speed_range_increments = 48;
  Int32Range transport_air_volume_range_increments = 49;
  Int32Range blow_out_air_volume_range_increments = 50;
  Int32Range pre_wetting_volume_range_increments = 51;
  Int32Range clot_detection_height_range_increments = 52;
  Int32Range settling_time_range_increments = 53;
  Int32Range mix_cycles_range = 54;
  Int32Range mix_position_range_increments = 55;
  Int32Range second_section_ratio_range_increments = 56;
  Int32Range lld_sensitivity_range = 57;
  Int32Range z_touch_off_position_range_increments = 58;
  Int32Range dual_lld_height_difference_range_increments = 59;
  Int32Range limit_curve_index_range = 60;
  Int32Range stop_back_volume_range_increments = 61;
  Int32Range side_touch_off_distance_range_increments = 62;
  double channel_size_z = 63;
  repeated PipetteConfiguration channels = 64;
}

// A pressure curve a channel recorded.
message TADMCurve {
  string measurement_id = 1;
  TADMOperation operation = 2;
  bool had_error = 3;
  repeated int32 pressures = 4;
}

// One channel, as it reported itself.
message PipetteConfiguration {
  optional PipetteChannelType channel_type = 1;
  optional PipetteHeadType head_type = 2;
  optional StopDiscType stop_disc_type = 3;
  optional PressureADC pressure_adc = 4;
  optional string firmware_version = 5;
  optional double width = 6;
}

message PipettesSenseTipPresenceRequest {
}

message PipettesSenseTipPresenceResponse {
  // One value per channel, 1 where a tip is mounted, 0-indexed from the back.
  repeated int32 presence = 1;
}

message PipettesRequestFirmwareVersionRequest {
  // Which channel to ask, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesRequestFirmwareVersionResponse {
  // The version string and its build date, e.g. `("4.0S j 2022-03-16", date(2022, 3, 16))`.
  string version = 1;
  Date date = 2;
}

message PipettesRequestMinPipetteWidthRequest {
  // Which channel to ask, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesRequestMinPipetteWidthResponse {
  // The width in mm.
  double min_pipette_width = 1;
}

message PipettesRequestPipetteConfigurationRequest {
  // Which channel to ask, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesRequestPipetteConfigurationResponse {
  // What the channel reports about itself. The fields it does not report - its firmware version and
  // its width - are left unset, since they are separate queries.
  PipetteConfiguration configuration = 1;
}

message PipettesDiscoverRequest {
}

message PipettesDiscoverResponse {
}

message PipettesGetReferencePointLocationsRequest {
}

message PipettesGetReferencePointLocationsResponse {
  // Per channel, where the model has it, or unset when nothing models it yet.
  repeated OptionalVec3 reference_point_locations = 1;
}

message PipettesGetReferencePointLocationRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesGetReferencePointLocationResponse {
  // Where the model has it, or unset when there is nothing modelling it yet.
  pylabrobot.resources.server.v1.Vec3 reference_point_location = 1;
}

message PipettesUpdateLocationsByReferencePointRequest {
  // Per channel, 0-indexed from the back, where it is now along Y and where its stop disc is along
  // Z, in mm on the deck. An axis left as it was is unset.
  map<int32, ReferencePointYZ> positions = 1;
}

message PipettesUpdateLocationsByReferencePointResponse {
}

message PipettesUpdateLocationByReferencePointRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
  // Where it is now, in mm on the deck. Left as it was when unset.
  optional double y = 2;
  // Where its stop disc is now, in mm on the deck. Left as it was when unset.
  optional double z = 3;
}

message PipettesUpdateLocationByReferencePointResponse {
}

message PipettesRequestYPositionsRequest {
}

message PipettesRequestYPositionsResponse {
  // The position of each channel in mm, back to front.
  repeated double y_positions = 1;
}

message PipettesRequestYPositionRequest {
  // The channel to request the position of.
  int32 channel = 1;
}

message PipettesRequestYPositionResponse {
  // The position of the requested channel in mm.
  double y_position = 1;
}

message PipettesRequestStopDiscZPositionRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesRequestStopDiscZPositionResponse {
  // Where its stop disc is, in mm on the deck.
  double stop_disc_z_position = 1;
}

message PipettesRequestStopDiscZPositionsRequest {
}

message PipettesRequestStopDiscZPositionsResponse {
  // Each channel's stop disc in mm, by channel, 0-indexed from the back.
  repeated double stop_disc_z_positions = 1;
}

message PipettesRequestToolBottomZPositionsRequest {
}

message PipettesRequestToolBottomZPositionsResponse {
  // The bottom of each channel's tip in mm, by channel, 0-indexed from the back.
  repeated double tool_bottom_z_positions = 1;
}

message PipettesRequestToolBottomZPositionRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesRequestToolBottomZPositionResponse {
  // Where the bottom of its tip is, in mm on the deck.
  double tool_bottom_z_position = 1;
}

message PipettesRequestTipOverhangRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesRequestTipOverhangResponse {
  // The overhang in mm, to 0.1 mm.
  double tip_overhang = 1;
}

message PipettesRequestYSpeedRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesRequestYSpeedResponse {
  // The speed in mm/s.
  double y_speed = 1;
}

message PipettesRequestYAccelerationLevelRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesRequestYAccelerationLevelResponse {
  // The level, 1 (gentlest) to 4.
  int32 y_acceleration_level = 1;
}

message PipettesRequestZSpeedRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesRequestZSpeedResponse {
  // The speed in mm/s.
  double z_speed = 1;
}

message PipettesRequestZAccelerationRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesRequestZAccelerationResponse {
  // The acceleration in mm/s2.
  double z_acceleration = 1;
}

message PipettesRequestXPositionRequest {
}

message PipettesRequestXPositionResponse {
  // The position in mm.
  double x_position = 1;
}

message PipettesMoveToXPositionRequest {
  // Where to go, in mm.
  double x = 1;
  // How hard to accelerate. Defaults to the X-arm that holds the pipettes.
  optional int32 acceleration_level = 2;
  // The motor current limit. Defaults to the X-arm that holds the pipettes.
  optional int32 current_limit = 3;
  // How many reads to take before calling the arm stopped.
  optional int32 settle_reads = 4;
}

message PipettesMoveToXPositionResponse {
  // The device's reply: as sent, or parsed; Unset when there was none.
  optional FirmwareReply reply = 1;
}

message PipettesMoveToYPositionsRequest {
  // Where to put each named channel, in mm, keyed by channel, 0-indexed from the back.
  map<int32, double> ys = 1;
  // Whether the channels not named may be moved, so that every pair meets its minimum Y spacing and
  // the channels stay in order back to front. Off by default: nothing moves that the caller did not
  // ask to move, and a request that will not fit raises instead. It can raise either way, since the
  // requested positions may leave no room.
  optional bool make_space = 2;
}

message PipettesMoveToYPositionsResponse {
  // The device's reply: as sent, or parsed; Unset when there was none.
  optional FirmwareReply reply = 1;
}

message PipettesMoveToYPositionRequest {
  // Which channel to move, 0-indexed from the back.
  int32 channel = 1;
  // Where to put it, in mm.
  double y = 2;
  // Whether the other channels may be moved to make room. Off by default. See
  // `move_to_y_positions`.
  optional bool make_space = 3;
}

message PipettesMoveToYPositionResponse {
  // The device's reply: as sent, or parsed; Unset when there was none.
  optional FirmwareReply reply = 1;
}

message PipettesMakeMaxSpaceForChannelRequest {
  // Which channel to free, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesMakeMaxSpaceForChannelResponse {
  // The device's reply: as sent, or parsed; Unset when there was none.
  optional FirmwareReply reply = 1;
}

message PipettesMoveStopDiscToZPositionRequest {
  // Which channel to move, 0-indexed from the back.
  int32 channel = 1;
  // Where to put its stop disc, in mm on the deck.
  double z = 2;
  // How fast, in mm/s. Defaults to `default_z_speed`.
  optional double speed = 3;
  // How hard, in mm/s2. Defaults to `default_z_acceleration`.
  optional double acceleration = 4;
  // The motor current limit. Defaults to `default_z_current_limit`.
  optional int32 current_limit = 5;
}

message PipettesMoveStopDiscToZPositionResponse {
  // The device's reply: as sent, or parsed; Unset when there was none.
  optional FirmwareReply reply = 1;
}

message PipettesMoveStopDiscToZPositionsRequest {
  // Where to put each named channel's stop disc, in mm, keyed by channel, 0-indexed from the back.
  map<int32, double> zs = 1;
  // How fast, in mm/s. Defaults to `default_z_speed`.
  optional double speed = 2;
  // How hard, in mm/s2. Defaults to `default_z_acceleration`.
  optional double acceleration = 3;
  // The motor current limit. Defaults to `default_z_current_limit`.
  optional int32 current_limit = 4;
}

message PipettesMoveStopDiscToZPositionsResponse {
}

message PipettesMoveToolBottomToZPositionsRequest {
  // Where to put each named channel's tip bottom, in mm, keyed by channel, 0-indexed from the back.
  map<int32, double> zs = 1;
}

message PipettesMoveToolBottomToZPositionsResponse {
  // The device's reply: as sent, or parsed; Unset when there was none.
  optional FirmwareReply reply = 1;
}

message PipettesMoveToolBottomToZPositionRequest {
  // Which channel to move, 0-indexed from the back.
  int32 channel = 1;
  // Where to put the bottom of its tip, in mm on the deck.
  double z = 2;
  // How fast, in mm/s. Defaults to `default_z_speed`.
  optional double speed = 3;
  // How hard, in mm/s2. Defaults to `default_z_acceleration`.
  optional double acceleration = 4;
  // The motor current limit. Defaults to `default_z_current_limit`.
  optional int32 current_limit = 5;
}

message PipettesMoveToolBottomToZPositionResponse {
  // The device's reply: as sent, or parsed; Unset when there was none.
  optional FirmwareReply reply = 1;
}

message PipettesProbeZMaxRequest {
}

message PipettesProbeZMaxResponse {
  // The z-positions of each channel's stop disc, in mm, by channel.
  repeated double z_max = 1;
}

message PipettesMoveToSafeZRequest {
  // In mm/s, held by the drives for the move. The stored speed when unset.
  optional double speed = 1;
  // In mm/s2, held by the drives for the move. The stored one when unset.
  optional double acceleration = 2;
}

message PipettesMoveToSafeZResponse {
}

message PipettesDispensingDriveRequestULPositionRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesDispensingDriveRequestULPositionResponse {
  // The piston's position in uL, 0.0 at rest; air and liquid alike. `get_piston_positions` reads
  // it.
  double position = 1;
}

message PipettesGetPistonPositionsRequest {
}

message PipettesGetPistonPositionsResponse {
  // Each channel's piston position, as the volume it has drawn, in uL, by channel; 0.0 at rest, air
  // and liquid alike. Empty until a position has been read or sent.
  repeated double piston_positions = 1;
}

message PipettesDispensingDrivesRequestULPositionsRequest {
  // Which channels, 0-indexed from the back. Every channel when unset.
  Int32List use_channels = 1;
}

message PipettesDispensingDrivesRequestULPositionsResponse {
  // One entry per channel of the device: the piston's position in uL, 0.0 at rest, air and liquid
  // alike, for a channel asked; Unset for one not asked, whose record is left alone.
  repeated OptionalDouble positions = 1;
}

message PipettesMoveToXyPositionsRequest {
  // Where to send the arm, in mm. The channels share it.
  double x = 1;
  // Where to put each named channel, in mm, keyed by channel, 0-indexed from the back.
  map<int32, double> ys = 2;
  // Whether the channels not named may be moved in Y. See `move_to_y_positions`.
  optional bool make_space = 3;
  // The height to raise every low channel's lowest point to first, in mm.
  // `default_minimum_traverse_height` when unset; 0 raises nothing.
  optional double minimum_traverse_height_start = 4;
}

message PipettesMoveToXyPositionsResponse {
}

message PipettesSpreadChannelsRequest {
}

message PipettesSpreadChannelsResponse {
  // The device's reply: as sent, or parsed; Unset when there was none.
  optional FirmwareReply reply = 1;
}

message PipettesGetToolsRequest {
}

message PipettesGetToolsResponse {
  repeated OptionalResourceNode tools = 1;
}

message PipettesGetMountedTipsRequest {
}

message PipettesGetMountedTipsResponse {
  repeated OptionalResourceNode mounted_tips = 1;
}

message PipettesGetMountedTipRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
}

message PipettesGetMountedTipResponse {
  pylabrobot.resources.server.v1.ResourceNode mounted_tip = 1;
}

message PipettesDispensingDriveMoveToULPositionRequest {
  // 0-indexed from the back.
  int32 channel = 1;
  // In uL, 0.0 at rest; -45.0 is the bottom limit.
  double position = 2;
  // In uL/s.
  optional double flow_rate = 3;
  // In uL/s2.
  optional double acceleration = 4;
  // 0 to 7.
  optional int32 current_limit = 5;
}

message PipettesDispensingDriveMoveToULPositionResponse {
}

message PipettesEmptyTipRequest {
  // 0-indexed from the back.
  int32 channel = 1;
  // Where to take the piston, in uL, at most 0.0. The bottom limit, -45.0, when unset.
  optional double position = 2;
  // In uL/s.
  optional double flow_rate = 3;
  // In uL/s2.
  optional double acceleration = 4;
  // 0 to 7.
  optional int32 current_limit = 5;
  // Whether the piston returns to 0 afterwards.
  optional bool reset_dispensing_drive_after = 6;
}

message PipettesEmptyTipResponse {
}

message PipettesEmptyTipsRequest {
  // 0-indexed from the back. Every channel that senses a tip when unset.
  Int32List use_channels = 1;
  // Where to take the pistons, in uL, at most 0.0. The bottom limit when unset.
  optional double position = 2;
  // In uL/s.
  optional double flow_rate = 3;
  // In uL/s2.
  optional double acceleration = 4;
  // 0 to 7.
  optional int32 current_limit = 5;
  // Whether the pistons return to 0 afterwards.
  optional bool reset_dispensing_drive_after = 6;
}

message PipettesEmptyTipsResponse {
}

message PipettesInitializeRequest {
  // X to eject at, in mm. Defaults to the device's tip waste position.
  optional double x_position = 1;
  // Where to put each channel in Y, in mm, back to front. Defaults to spreading them evenly across
  // the Y band the procedure uses.
  DoubleList y_positions = 2;
  // Z to start the eject from, in mm.
  optional double begin_of_tip_deposit_process = 3;
  // Z the eject ends at, in mm.
  optional double end_of_tip_deposit_process = 4;
  // Z to leave the channels at, in mm.
  optional double minimum_traverse_height_end = 5;
  // Which channels take part. Defaults to all of them.
  BoolList tip_pattern = 6;
  // Tip type table index.
  optional int32 tip_type = 7;
  // How tips are discarded.
  optional int32 discarding_method = 8;
  // Deprecated, use `minimum_traverse_height_end`.
  optional double z_position_at_end_of_a_command = 9;
}

message PipettesInitializeResponse {
  // The device's reply: as sent, or parsed; Unset when there was none.
  optional FirmwareReply reply = 1;
}

message PipettesProbeXUsingClldRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
  // "left" (decreasing x) or "right" (increasing x).
  XProbeDirection direction = 2;
  // Where the search ends, in mm. The end of the reach in `direction` when unset.
  optional double search_end_position = 3;
  // How far to back away from the surface afterwards, in mm.
  optional double post_detection_distance = 4;
  // The tip's bottom diameter, in mm; half of it is added to the reading.
  optional double tip_bottom_diameter = 5;
  // The stop disc's, in mm, for a channel probing without a tip.
  optional double stop_disc_diameter = 6;
  // Whether to probe without a tip, on the stop disc. False requires one.
  optional bool allow_without_tip = 7;
  // How long to wait for the search, in s.
  optional int32 read_timeout = 8;
}

message PipettesProbeXUsingClldResponse {
  // The surface's X in mm, rounded to 0.1 mm, or unset if the search found nothing.
  optional double x_position = 1;
}

message PipettesProbeYUsingClldRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
  // "forward" (decreasing y) or "backward" (increasing y).
  YProbeDirection direction = 2;
  // Where to search from, in mm. Where the channel stands when unset.
  optional double search_start_position = 3;
  // Where the search ends, in mm. As far as the neighbour allows when unset.
  optional double search_end_position = 4;
  // In mm/s.
  optional double search_speed = 5;
  // 1 to 4, each `level * 5000` increments/s2.
  optional int32 acceleration_level = 6;
  // CLLD edge steepness, 0 to 1023.
  optional int32 detection_edge = 7;
  // The Y drive's current limit, 0 to 7.
  optional int32 current_limit = 8;
  // How far to back away from the surface afterwards, in mm; less if the neighbour is closer.
  optional double post_detection_distance = 9;
  // The tip's bottom diameter, in mm; half of it is added to the reading. 1.2 is the teaching
  // needle's.
  optional double tip_bottom_diameter = 10;
  // The stop disc's, in mm, for a channel probing without a tip.
  optional double stop_disc_diameter = 11;
  // Whether to probe without a tip, on the stop disc. False requires one.
  optional bool allow_without_tip = 12;
}

message PipettesProbeYUsingClldResponse {
  // The surface's Y in mm, rounded to 0.1 mm, or unset if the search found nothing.
  optional double y_position = 1;
}

message PipettesRequestLastLldZPositionsRequest {
}

message PipettesRequestLastLldZPositionsResponse {
  // The tip bottom's Z position at detection, in mm on the deck, by channel.
  repeated double last_lld_z_positions = 1;
}

message PipettesProbeZUsingClldRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
  // Tip bottom height to search from, in mm. As high as the tip goes when unset.
  optional double search_start_position = 2;
  // Lowest tip bottom height, in mm. The drive's floor when unset.
  optional double search_end_position = 3;
  // In mm/s.
  optional double search_speed = 4;
  // In mm/s2.
  optional double acceleration = 5;
  // CLLD edge steepness, 0 to 1023.
  optional int32 detection_edge = 6;
  // Offset after the edge, 0 to 1023.
  optional int32 detection_drop = 7;
  // 0 moves down after detection, 1 up.
  optional int32 post_detection_trajectory = 8;
  // Whether to probe without a tip, on the stop disc. False requires one.
  optional bool allow_without_tip = 9;
  // How far it moves after detection, in mm.
  optional double post_detection_distance = 10;
  // Whether to raise every channel to Z safety afterwards, instead of resting where the search left
  // it.
  optional bool move_to_safe_z_position_after = 11;
}

message PipettesProbeZUsingClldResponse {
  // The height the channel detected at, in mm, or unset if the search found nothing.
  optional double height = 1;
}

message PipettesProbeZUsingPlldRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
  // Tip bottom height to search from, in mm. As high as the tip goes when unset.
  optional double search_start_position = 2;
  // Lowest tip bottom height, in mm. The drive's floor when unset.
  optional double search_end_position = 3;
  // What the search stops at. The liquid when unset.
  optional PressureLLDMode pressure_mode = 4;
  // Whether to probe without a tip, on the stop disc. False requires one.
  optional bool allow_without_tip = 5;
  // How far it moves after detection, in mm.
  optional double post_detection_distance = 6;
  // Whether to raise every channel to Z safety afterwards, instead of resting where the search left
  // it.
  optional bool move_to_safe_z_position_after = 7;
  // Passed on to `plld_search`:
  // above the start position, in mm/s.
  optional double approach_speed = 8;
  // In mm/s.
  optional double search_speed = 9;
  // In mm/s2.
  optional double acceleration = 10;
  // Z drive current limit, 0 to 7. `default_z_current_limit` when unset.
  optional int32 z_current_limit = 11;
  // Whether the tip has a filter. What the model says of the mounted tip when unset, and no filter
  // if the model has none.
  optional bool tip_has_filter = 12;
  // Of the dispensing drive during the search, in mm/s.
  optional double dispensing_speed = 13;
  // In mm/s2.
  optional double dispensing_acceleration = 14;
  // In mm/s.
  optional double dispensing_max_speed = 15;
  // 0 to 7.
  optional int32 dispensing_current_limit = 16;
  // PLLD edge steepness, 0 to 1023.
  optional int32 detection_edge = 17;
  // Offset after the pLLD edge, 0 to 1023.
  optional int32 detection_drop = 18;
  // Whether the cLLD searches alongside to verify.
  optional bool clld_verification = 19;
  // CLLD edge steepness, 0 to 1023.
  optional int32 clld_detection_edge = 20;
  // Offset after the cLLD edge, 0 to 1023.
  optional int32 clld_detection_drop = 21;
  // How far the two detections may differ, in mm.
  optional double max_delta_plld_clld = 22;
  // 0 to 1023.
  optional int32 foam_detection_drop = 23;
  // 0 to 1023.
  optional int32 foam_detection_edge_tolerance = 24;
  // 0 to 4999.
  optional int32 foam_ad_values = 25;
  // Through the foam, in mm/s.
  optional double foam_search_speed = 26;
  // Dispensed back after detection, in uL. Nothing when unset.
  optional double dispense_back_volume = 27;
  // 0 moves down after detection, 1 up.
  optional int32 post_detection_trajectory = 28;
  // How long to wait for the search, in s.
  optional int32 read_timeout = 29;
}

message PipettesProbeZUsingPlldResponse {
  // The tip bottom heights detected, in mm: the liquid's, or in foam mode the foam's and then the
  // liquid's. Unset if the search found nothing.
  DoubleList heights = 1;
}

message PipettesProbeZUsingZtouchRequest {
  // Which channel, 0-indexed from the back.
  int32 channel = 1;
  // Tip bottom height the search starts from, in mm. As high as the tip goes when unset.
  optional double search_start_position = 2;
  // Lowest tip bottom height, in mm. The drive's floor when unset.
  optional double search_end_position = 3;
  // In mm/s.
  optional double search_speed = 4;
  // Down to the start, in mm/s.
  optional double approach_speed = 5;
  // In mm/s2.
  optional double acceleration = 6;
  // The force at which the search stops, 0 to 125.
  optional int32 detection_limiter_pwm = 7;
  // The push-down force once stopped, 0 to 125; 0 switches the drive off.
  optional int32 push_force_pwm = 8;
  // Whether to probe without a tip, on the stop disc. False requires one.
  optional bool allow_without_tip = 9;
  // How far the channel backs off afterwards, in mm; 0 stays.
  optional double post_detection_distance = 10;
  // Whether to raise every channel to Z safety afterwards, instead of resting where the search left
  // it.
  optional bool move_to_safe_z_position_after = 11;
}

message PipettesProbeZUsingZtouchResponse {
  // The tip bottom height where it stopped, in mm, or unset if it reached the end.
  optional double height = 1;
}

message PipettesProbeLiquidHeightsRequest {
  // Any number; a whole plate is fine.
  repeated pylabrobot.resources.server.v1.ResourceRef containers = 1;
  // Which channels, 0-indexed from the back. The first len(containers) when unset, up to every
  // channel.
  Int32List use_channels = 2;
  // Added to where each channel goes in its container, in mm. Planned when unset, spreading channels
  // that share a container.
  Vec3List resource_offsets = 3;
  // How to search, one for all or one per container. Capacitive when unset.
  oneof lld_mode {
    LLDMode lld_mode_lldmode = 4;
    LLDModeList lld_mode_each = 5;
  }
  // In mm/s.
  optional double search_speed = 6;
  // How many times each container is searched; the heights are averaged.
  optional int32 n_replicates = 7;
  // The height every low channel's lowest point is raised to before the first batch, in mm. Z
  // safety when unset.
  optional double minimum_traverse_height_start = 8;
  // The same, between batches. Z safety when unset.
  optional double minimum_traverse_height_during = 9;
  // Where the tips used are left, in mm. Z safety when unset.
  optional double minimum_traverse_height_end = 10;
  // Containers within this X distance share a batch, in mm. `default_x_grouping_tolerance` when
  // unset.
  optional double x_grouping_tolerance = 11;
}

message PipettesProbeLiquidHeightsResponse {
  // How high the liquid stands above each container's cavity bottom, in mm, in the order given. The
