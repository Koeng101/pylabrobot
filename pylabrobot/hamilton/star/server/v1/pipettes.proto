message PipettesAspirateRequest {
  // Any number.
  repeated pylabrobot.resources.server.v1.ResourceRef containers = 1;
  // Liquid to take from each container, corrected by a liquid class. One of this and
  // `piston_volumes`.
  DoubleList volumes = 2;
  // Which channels, 0-indexed from the back. The first len(containers) when unset.
  Int32List use_channels = 3;
  // Offset of each channel in its container, in mm. Planned when unset. The z shifts the heights.
  Vec3List resource_offsets = 4;
  // Where each OFF draw goes, above the cavity bottom, in mm. The cavity bottom when unset. Refused
  // for a container with an LLD mode, whose search finds the surface.
  OptionalDoubleList liquid_heights = 5;
  // How the liquid, or under ZTOUCH the floor, is found, one for all or one per container. OFF goes
  // to the surface as given. DUAL refuses. OFF when unset; CAPACITIVE under
  // `auto_surface_following`.
  oneof lld_mode {
    LLDMode lld_mode_lldmode = 6;
    LLDModeList lld_mode_each = 7;
  }
  // In uL/s. The class's, else 100.0, when unset.
  DoubleList flow_rates = 8;
  // One per container. Looked up for the channel's tip, water, `jet` and `blow_out` when unset.
  LiquidClassList hamilton_liquid_classes = 9;
  // Whether the later dispense is a jet, for the lookup. False when unset.
  BoolList jet = 10;
  // Whether the later dispense blows out, for the lookup. False when unset.
  BoolList blow_out = 11;
  // What each piston draws, in uL, as given. One of this and `volumes`.
  DoubleList piston_volumes = 12;
  // Of the driver's own search, liquid or floor, in mm/s.
  optional double search_speed = 13;
  // Down to that search's start, `lp` or the top, in mm/s.
  optional double approach_speed = 14;
  // Air drawn before the liquid, in uL. The class's, else 0.0, when unset. Under an LLD mode drawn
  // beforehand, at most 468.7 uL.
  DoubleList blow_out_air_volumes = 15;
  // How far into the liquid each tip goes, in mm; negative is out of it.
  DoubleList immersion_depths = 16;
  // How low each tip bottom may go, in mm on the deck. The cavity bottom plus the offset's z when
  // unset. Below the cavity bottom is allowed: the tip then presses onto the well's floor and draws
  // with suction, as a harvest wants.
  DoubleList minimum_allowed_z_positions_during = 17;
  // Drawn and returned first, in uL. The class's over-aspirate volume, else 0.0, when unset.
  DoubleList pre_wetting_volumes = 18;
  // A `Mix` per container, mixed before the draw, unset for no mixing. Its auto surface following
  // needs a surface, as the call's.
  OptionalMixList pre_mixes = 19;
  // Mixing depth under the surface, in mm, per container. 0.0 when unset.
  DoubleList mix_positions_from_liquid_surface = 20;
  // How far each tip follows the sinking surface, in mm. 0.0 when unset.
  DoubleList surface_following_distances = 21;
  // Follow by how far each batch's draw lowers the surface found, or the one at `liquid_heights`
  // under OFF; never below the floor, so nothing under ZTOUCH. Refused beside a distance.
  optional bool auto_surface_following = 22;
  // Height of each container's narrower lower section, in mm. 3.2 when unset.
  DoubleList second_section_heights = 23;
  // That section's bottom to top ratio, in tenths. 618.0 when unset.
  DoubleList second_section_ratios = 24;
  // Wait in the liquid, in s. The class's, else 0.0, when unset.
  DoubleList settling_times = 25;
  // Speed of leaving the liquid, in mm/s. The class's, else 100.0, when unset.
  DoubleList swap_speeds = 26;
  // How far a clot may hold the tip back, in mm. The class's, else 0.0, when unset.
  DoubleList clot_detection_heights = 27;
  // Rise before drawing transport air, in mm, per container. 10.0 when unset.
  DoubleList pull_out_distances_transport_air = 28;
  // Air drawn after the liquid, in uL. The class's, else 0.0, when unset.
  DoubleList transport_air_volumes = 29;
  // TADM limit curve, 0 for none, per container. 0 when unset.
  Int32List limit_curve_indices = 30;
  // Raise of every low channel before the first batch, in mm. `default_minimum_traverse_height`
  // when unset.
  optional double minimum_traverse_height_start = 31;
  // The same between batches, and each batch's end height. `default_minimum_traverse_height` when
  // unset.
  optional double minimum_traverse_height_during = 32;
  // Where the tips are left, in mm. `default_minimum_traverse_height` when unset.
  optional double minimum_traverse_height_end = 33;
  // X distance within which containers share a batch, in mm. `default_x_grouping_tolerance` when
  // unset.
  optional double x_grouping_tolerance = 34;
}

message PipettesAspirateResponse {
}

message PipettesDispenseRequest {
  // Any number.
  repeated pylabrobot.resources.server.v1.ResourceRef containers = 1;
  // Liquid to put into each container, corrected by a liquid class. One of this and
  // `piston_volumes`.
  DoubleList volumes = 2;
  // Which channels, 0-indexed from the back. The first len(containers) when unset.
  Int32List use_channels = 3;
  // Offset of each channel in its container, in mm. Planned when unset. The z shifts the heights.
  Vec3List resource_offsets = 4;
  // Where each OFF dispense goes, above the cavity bottom, in mm. The cavity bottom when unset.
  // Refused for a container with an LLD mode, whose search finds the surface.
  OptionalDoubleList liquid_heights = 5;
  // How the liquid, or under ZTOUCH the floor, is found, one for all or one per container. OFF goes
  // to the height given. PRESSURE and DUAL refuse. OFF when unset; CAPACITIVE under
  // `auto_surface_following`.
  oneof lld_mode {
    LLDMode lld_mode_lldmode = 6;
    LLDModeList lld_mode_each = 7;
  }
  // In uL/s. The class's, else 120.0, when unset.
  DoubleList flow_rates = 8;
  // One per container. Looked up for the channel's tip, water, `jet` and `blow_out` when unset.
  LiquidClassList hamilton_liquid_classes = 9;
  // Whether each dispense is a jet from above the liquid. False when unset: at the surface.
  BoolList jet = 10;
  // Whether the blow-out air follows the liquid out. False when unset.
  BoolList blow_out = 11;
  // Whether the tip is emptied where it stands, air and all; the model then books what the tip
  // holds. False when unset.
  BoolList empty = 12;
  // What each piston pushes out, in uL, as given. One of this and `volumes`.
  DoubleList piston_volumes = 13;
  // Of the driver's own search, liquid or floor, in mm/s.
  optional double search_speed = 14;
  // Down to that search's start, `lp` or the top, in mm/s.
  optional double approach_speed = 15;
  // Sideways move against the wall to shed the drop, in mm; 0 for none.
  optional double side_touch_off_distance = 16;
  // How far into the liquid each tip goes, in mm; negative is out of it.
  DoubleList immersion_depths = 17;
  // How low each tip bottom may go, in mm on the deck. The cavity bottom plus the offset's z when
  // unset.
  DoubleList minimum_allowed_z_positions_during = 18;
  // Air drawn after each dispense, in uL, pushed out ahead of the next. The class's, else 0.0, when
  // unset.
  DoubleList transport_air_volumes = 19;
  // The flow each dispense ends at, in uL/s. The class's, else 5.0, when unset.
  DoubleList cut_off_speeds = 20;
  // Drawn back after each dispense, in uL. The class's, else 0.0, when unset.
  DoubleList stop_back_volumes = 21;
  // How far each tip follows the rising surface, in mm. 0.0 when unset.
  DoubleList surface_following_distances = 22;
  // Follow by how far each batch's dispense raises the surface found, or the one at
  // `liquid_heights` under OFF; never above the top. Refused beside a distance. An empty container
  // has no surface to find: give OFF and `liquid_heights` there.
  optional bool auto_surface_following = 23;
  // Height of each container's narrower lower section, in mm. 3.2 when unset.
  DoubleList second_section_heights = 24;
  // That section's bottom to top ratio, in tenths. 618.0 when unset.
  DoubleList second_section_ratios = 25;
  // Air pushed out after the liquid in a blow-out mode, in uL. The class's, else 0.0, when unset.
  DoubleList blow_out_air_volumes = 26;
  // A `Mix` per container, mixed after the dispense, unset for no mixing. Its auto surface following
  // needs a surface, as the call's.
  OptionalMixList post_mixes = 27;
  // Mixing depth under the surface, in mm, per container. 0.0 when unset.
  DoubleList mix_positions_from_liquid_surface = 28;
  // Wait after the dispense, in s. The class's, else 0.0, when unset.
  DoubleList settling_times = 29;
  // Speed of leaving the liquid, in mm/s. The class's, else 10.0, when unset.
  DoubleList swap_speeds = 30;
  // Rise before drawing transport air, in mm, per container. 10.0 when unset.
  DoubleList pull_out_distances_transport_air = 31;
  // TADM limit curve, 0 for none, per container. 0 when unset.
  Int32List limit_curve_indices = 32;
  // Raise of every low channel before the first batch, in mm. `default_minimum_traverse_height`
  // when unset.
  optional double minimum_traverse_height_start = 33;
  // The same between batches, and each batch's end height. `default_minimum_traverse_height` when
  // unset.
  optional double minimum_traverse_height_during = 34;
  // Where the tips are left, in mm. `default_minimum_traverse_height` when unset.
  optional double minimum_traverse_height_end = 35;
  // X distance within which containers share a batch, in mm. `default_x_grouping_tolerance` when
  // unset.
  optional double x_grouping_tolerance = 36;
}

message PipettesDispenseResponse {
}

// The defaults Pipettes uses where a call names none. A STAR server takes them from its
// settings file; unset fields keep the defaults in the code.
message PipettesSettings {
  // Y speed when the caller names none, in mm/s.
  optional double default_y_speed = 1;
  // Y acceleration level when the caller names none, 1 (gentlest) to 4.
  optional int32 default_y_acceleration_level = 2;
  // Z speed when the caller names none, in mm/s.
  optional double default_z_speed = 3;
  // Z acceleration when the caller names none, in mm/s2.
  optional double default_z_acceleration = 4;
  // Z drive current limit when the caller names none.
  optional int32 default_z_current_limit = 5;
  // Height the channels travel at when a command names none, in mm.
  optional double default_minimum_traverse_height = 6;
  // Containers within this X distance are probed in one batch, in mm.
  optional double default_x_grouping_tolerance = 7;
}

service PipettesService {
  // Sense tip presence on every channel, from their sleeve sensors.
  rpc SenseTipPresence(PipettesSenseTipPresenceRequest) returns (PipettesSenseTipPresenceResponse);
  // Request one channel's firmware version and build date.
  rpc RequestFirmwareVersion(PipettesRequestFirmwareVersionRequest) returns (PipettesRequestFirmwareVersionResponse);
  // Request how wide a pipette is.
  rpc RequestMinPipetteWidth(PipettesRequestMinPipetteWidthRequest) returns (PipettesRequestMinPipetteWidthResponse);
  // Request what hardware is fitted to a pipette.
  rpc RequestPipetteConfiguration(PipettesRequestPipetteConfigurationRequest) returns (PipettesRequestPipetteConfigurationResponse);
  // Read what each channel is and what it can do.
  rpc Discover(PipettesDiscoverRequest) returns (PipettesDiscoverResponse);
  // Where the model has every channel's reference point, in mm on the deck, in one read.
  rpc GetReferencePointLocations(PipettesGetReferencePointLocationsRequest) returns (PipettesGetReferencePointLocationsResponse);
  // Where the model has a channel's reference point, in mm on the deck.
  rpc GetReferencePointLocation(PipettesGetReferencePointLocationRequest) returns (PipettesGetReferencePointLocationResponse);
  // Record where channels are on the resources that model them, all in one call.
  rpc UpdateLocationsByReferencePoint(PipettesUpdateLocationsByReferencePointRequest) returns (PipettesUpdateLocationsByReferencePointResponse);
  // Record where a channel is on the resource that models it. See
  // `update_locations_by_reference_point`.
  rpc UpdateLocationByReferencePoint(PipettesUpdateLocationByReferencePointRequest) returns (PipettesUpdateLocationByReferencePointResponse);
  // Request where every channel is along Y, in one command.
  rpc RequestYPositions(PipettesRequestYPositionsRequest) returns (PipettesRequestYPositionsResponse);
  // Request where a specific channel is along Y.
  rpc RequestYPosition(PipettesRequestYPositionRequest) returns (PipettesRequestYPositionResponse);
  // Read where one channel's stop disc is, regardless of whether a tool (e.g. tip, core_gripper,
  // suction_gripper, ...) is mounted.
  rpc RequestStopDiscZPosition(PipettesRequestStopDiscZPositionRequest) returns (PipettesRequestStopDiscZPositionResponse);
  // Read where every channel's stop disc is.
  rpc RequestStopDiscZPositions(PipettesRequestStopDiscZPositionsRequest) returns (PipettesRequestStopDiscZPositionsResponse);
  // Read where the bottom of the tip on every channel is.
  rpc RequestToolBottomZPositions(PipettesRequestToolBottomZPositionsRequest) returns (PipettesRequestToolBottomZPositionsResponse);
  // Read where the bottom of the tip on one channel is.
  rpc RequestToolBottomZPosition(PipettesRequestToolBottomZPositionRequest) returns (PipettesRequestToolBottomZPositionResponse);
  // Measure how far the tip on one channel stands below its stop disc.
  rpc RequestTipOverhang(PipettesRequestTipOverhangRequest) returns (PipettesRequestTipOverhangResponse);
  // Request the Y speed a channel's drive holds (`Px RA yv`).
  rpc RequestYSpeed(PipettesRequestYSpeedRequest) returns (PipettesRequestYSpeedResponse);
  // Request the Y acceleration level a channel's drive holds (`Px RA yr`).
  rpc RequestYAccelerationLevel(PipettesRequestYAccelerationLevelRequest) returns (PipettesRequestYAccelerationLevelResponse);
  // Request the Z speed a channel's drive holds (`Px RA zv`).
  rpc RequestZSpeed(PipettesRequestZSpeedRequest) returns (PipettesRequestZSpeedResponse);
  // Request the Z acceleration a channel's drive holds (`Px RA zr`).
  rpc RequestZAcceleration(PipettesRequestZAccelerationRequest) returns (PipettesRequestZAccelerationResponse);
  // Request where along X the channels are, in deck mm.
  rpc RequestXPosition(PipettesRequestXPositionRequest) returns (PipettesRequestXPositionResponse);
  // Move the channels along X. The whole arm travels, with everything else it carries.
  rpc MoveToXPosition(PipettesMoveToXPositionRequest) returns (PipettesMoveToXPositionResponse);
  // Move channels along Y.
  rpc MoveToYPositions(PipettesMoveToYPositionsRequest) returns (PipettesMoveToYPositionsResponse);
  // Move one channel along Y.
  rpc MoveToYPosition(PipettesMoveToYPositionRequest) returns (PipettesMoveToYPositionResponse);
  // Spread the channels to leave one of them as much free Y as the arm allows.
  rpc MakeMaxSpaceForChannel(PipettesMakeMaxSpaceForChannelRequest) returns (PipettesMakeMaxSpaceForChannelResponse);
  // Move one channel's stop disc along Z. The other channels stay where they are.
  rpc MoveStopDiscToZPosition(PipettesMoveStopDiscToZPositionRequest) returns (PipettesMoveStopDiscToZPositionResponse);
  // Move each named channel's stop disc along Z, all together (`Px ZA` per channel).
  rpc MoveStopDiscToZPositions(PipettesMoveStopDiscToZPositionsRequest) returns (PipettesMoveStopDiscToZPositionsResponse);
  // Move the bottom of the tip on each named channel along Z, in one command.
  rpc MoveToolBottomToZPositions(PipettesMoveToolBottomToZPositionsRequest) returns (PipettesMoveToolBottomToZPositionsResponse);
  // Move the bottom of the tip on one channel along Z.
  rpc MoveToolBottomToZPosition(PipettesMoveToolBottomToZPositionRequest) returns (PipettesMoveToolBottomToZPositionResponse);
  // Raises single-channel pipettes to Z safety and reads their stop discs z-positions.
  rpc ProbeZMax(PipettesProbeZMaxRequest) returns (PipettesProbeZMaxResponse);
  // Raise every channel to Z safety together (`C0 ZA`), whatever is mounted.
  rpc MoveToSafeZ(PipettesMoveToSafeZRequest) returns (PipettesMoveToSafeZResponse);
  // Read where one channel's dispensing drive stands, in uL, and record it. `Px RD`.
  rpc DispensingDriveRequestULPosition(PipettesDispensingDriveRequestULPositionRequest) returns (PipettesDispensingDriveRequestULPositionResponse);
  // Where each channel's piston stands, as this driver last read or sent it.
  rpc GetPistonPositions(PipettesGetPistonPositionsRequest) returns (PipettesGetPistonPositionsResponse);
  // Read where the dispensing drives stand, in uL, the channels together, and record them.
  rpc DispensingDrivesRequestULPositions(PipettesDispensingDrivesRequestULPositionsRequest) returns (PipettesDispensingDrivesRequestULPositionsResponse);
  // Move the channels across the deck: the low ones up first, then X and Y together.
  rpc MoveToXyPositions(PipettesMoveToXyPositionsRequest) returns (PipettesMoveToXyPositionsResponse);
  // Spread the channels evenly across the Y band. This moves them.
  rpc SpreadChannels(PipettesSpreadChannelsRequest) returns (PipettesSpreadChannelsResponse);
  // What the model has on each channel's shaft, a tip or a tool, per channel, in one read.
  rpc GetTools(PipettesGetToolsRequest) returns (PipettesGetToolsResponse);
  // The tip the model has on each channel, per channel, in one read; Unset where it has none.
  rpc GetMountedTips(PipettesGetMountedTipsRequest) returns (PipettesGetMountedTipsResponse);
  // The tip the model has on a channel, or unset if it carries none. See `get_mounted_tips`.
  rpc GetMountedTip(PipettesGetMountedTipRequest) returns (PipettesGetMountedTipResponse);
  // Move one channel's piston to a position where the tip stands, and read it back. `Px DS`.
  rpc DispensingDriveMoveToULPosition(PipettesDispensingDriveMoveToULPositionRequest) returns (PipettesDispensingDriveMoveToULPositionResponse);
  // Push everything out of one channel's tip where it stands, the piston at or below rest.
  rpc EmptyTip(PipettesEmptyTipRequest) returns (PipettesEmptyTipResponse);
  // Empty several channels' tips where they stand, the channels in parallel. See `empty_tip`.
  rpc EmptyTips(PipettesEmptyTipsRequest) returns (PipettesEmptyTipsResponse);
  // Initialize the channels, discarding whatever is mounted on them.
  rpc Initialize(PipettesInitializeRequest) returns (PipettesInitializeResponse);
  // Probe a conductive surface along X with a channel's cLLD, from where the arm stands.
  rpc ProbeXUsingClld(PipettesProbeXUsingClldRequest) returns (PipettesProbeXUsingClldResponse);
  // Probe a conductive surface along Y with a channel's cLLD, never past its neighbours.
  rpc ProbeYUsingClld(PipettesProbeYUsingClldRequest) returns (PipettesProbeYUsingClldResponse);
  // Request where each channel last detected liquid, by cLLD or pLLD. `C0 RL`.
  rpc RequestLastLldZPositions(PipettesRequestLastLldZPositionsRequest) returns (PipettesRequestLastLldZPositionsResponse);
  // Lower a channel's tip until its cLLD triggers, and read the height it detected at.
  rpc ProbeZUsingClld(PipettesProbeZUsingClldRequest) returns (PipettesProbeZUsingClldResponse);
  // Lower a channel's tip until the pressure says it met the liquid, and read the height.
  rpc ProbeZUsingPlld(PipettesProbeZUsingPlldRequest) returns (PipettesProbeZUsingPlldResponse);
  // Lower a channel's tip until it presses on something, and read the height.
  rpc ProbeZUsingZtouch(PipettesProbeZUsingZtouchRequest) returns (PipettesProbeZUsingZtouchResponse);
  // Find the liquid surface in each container with a channel's tip, and say how high it stands.
  rpc ProbeLiquidHeights(PipettesProbeLiquidHeightsRequest) returns (PipettesProbeLiquidHeightsResponse);
  // Find the liquid in each container as `probe_liquid_heights` does, and say how much there is.
  rpc ProbeLiquidVolumes(PipettesProbeLiquidVolumesRequest) returns (PipettesProbeLiquidVolumesResponse);
  // Touch the floor of each container with a channel's tip, and say how high it is.
  rpc ProbeZHeightsUsingZtouch(PipettesProbeZHeightsUsingZtouchRequest) returns (PipettesProbeZHeightsUsingZtouchResponse);
  // Pick up a tip from each spot, one channel per spot, and move each onto its channel.
  rpc PickUpTips(PipettesPickUpTipsRequest) returns (PipettesPickUpTipsResponse);
  // Drop each channel's tip into a tip spot, a trash, or anywhere on the deck.
  rpc DropTips(PipettesDropTipsRequest) returns (PipettesDropTipsResponse);
  // Put each channel's tip back in the tip spot it was picked up from, as legacy does.
  rpc ReturnTips(PipettesReturnTipsRequest) returns (PipettesReturnTipsResponse);
  // Discard each channel's tip into the deck's waste, spread across it as legacy spreads them.
  rpc DiscardTips(PipettesDiscardTipsRequest) returns (PipettesDiscardTipsResponse);
  // Move tips between partly filled racks of one tip model until they fill the fewest racks.
  rpc ConsolidateTipInventory(PipettesConsolidateTipInventoryRequest) returns (PipettesConsolidateTipInventoryResponse);
  // Find which spots hold a tip by picking each up and putting it back, as legacy's.
  rpc ProbeTipPresenceViaPickup(PipettesProbeTipPresenceViaPickupRequest) returns (PipettesProbeTipPresenceViaPickupResponse);
  // Probe any number of spots in any order, dealt a column at a time as `plan_inventory`.
  rpc ProbeTipInventory(PipettesProbeTipInventoryRequest) returns (PipettesProbeTipInventoryResponse);
  // Read a channel's pressure sensor now. `Px RP`.
  rpc RequestChannelPressure(PipettesRequestChannelPressureRequest) returns (PipettesRequestChannelPressureResponse);
  // Auto-adjust a channel's pressure sensor gain and offset. `Px AC`.
  rpc AutoAdjustPressureSensor(PipettesAutoAdjustPressureSensorRequest) returns (PipettesAutoAdjustPressureSensorResponse);
  // Switch a channel between TADM mode and pressure/capacitive LLD mode. `Px AF`.
  rpc SetTadmMode(PipettesSetTadmModeRequest) returns (PipettesSetTadmModeResponse);
  // Whether a channel is in TADM mode. `Px QF`.
  rpc RequestTadmMode(PipettesRequestTadmModeRequest) returns (PipettesRequestTadmModeResponse);
  // Empty a channel's TADM curve FIFO. `Px AN`.
  rpc ClearTadmFifo(PipettesClearTadmFifoRequest) returns (PipettesClearTadmFifoResponse);
  // Erase a channel's limit-curve bank and load the default curve at index 0. `Px AQ`.
  rpc ResetTadmLimitCurves(PipettesResetTadmLimitCurvesRequest) returns (PipettesResetTadmLimitCurvesResponse);
  // Record every aspirate and dispense on a channel until `stop_tadm_monitoring`. `Px BG`.
  rpc StartTadmMonitoring(PipettesStartTadmMonitoringRequest) returns (PipettesStartTadmMonitoringResponse);
  // End the monitoring `start_tadm_monitoring` began. `Px BH`.
  rpc StopTadmMonitoring(PipettesStopTadmMonitoringRequest) returns (PipettesStopTadmMonitoringResponse);
  // Read the next recorded curve from a channel's TADM FIFO.
  rpc ReadTadmCurve(PipettesReadTadmCurveRequest) returns (PipettesReadTadmCurveResponse);
  // Draw liquid from each container with a channel's tip.
  rpc Aspirate(PipettesAspirateRequest) returns (PipettesAspirateResponse);
  // Dispense liquid into each container from a channel's tip.
  rpc Dispense(PipettesDispenseRequest) returns (PipettesDispenseResponse);
}
